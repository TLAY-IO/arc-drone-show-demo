name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: License + scrub checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run verify-build
        run: bash scripts/verify-build.sh

  web:
    name: cloud/web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: cloud/web/package-lock.json
      - name: Install
        working-directory: cloud/web
        # npm ci (not install): fail loudly when package-lock.json is out of
        # sync with package.json instead of green-lighting a drifted tree.
        run: npm ci
      - name: Type check
        working-directory: cloud/web
        run: npx tsc --noEmit
      - name: Lint
        working-directory: cloud/web
        # Fails on errors only. Two React Compiler rules are downgraded to
        # warnings in eslint.config.mjs — see the note there.
        run: npm run lint
      - name: Build
        working-directory: cloud/web
        run: npm run build

  settle-worker:
    name: cloud/settle-worker syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Syntax check
        run: |
          node --check cloud/settle-worker/index.js
          node --check cloud/settle-worker/single-instance-guard.js

  burn-intent-worker:
    name: cloud/burn-intent-worker tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: cloud/burn-intent-worker/package-lock.json
      - name: Install
        working-directory: cloud/burn-intent-worker
        run: npm ci
      - name: BurnIntent EIP-712 tests
        working-directory: cloud/burn-intent-worker
        # Checks the type table and digest against Circle's published type
        # strings and typehash constants, and against a by-hand EIP-712
        # computation. It does not contact Circle or Arc: whether the deployed
        # Gateway accepts a signature is only proven by a live settlement.
        run: npm test
      - name: Syntax check
        run: |
          node --check cloud/burn-intent-worker/index.js
          node --check cloud/burn-intent-worker/burn-intent.js
          node --check cloud/burn-intent-worker/single-instance-guard.js
          node --check cloud/burn-intent-worker/scripts/gen-operator-wallet.js

  sim-smoke:
    name: no-hardware stack smoke test
    runs-on: ubuntu-latest
    # The only job that runs the cloud side: it brings up broker + SSE bridge +
    # page against the device simulator and asserts that slices and a settle
    # ack reach /api/stream. It covers the topic layout, the bridge and the
    # web image build. It does NOT cover signing, settlement or minting —
    # nothing in the sim stack touches HashAnchor, Circle or Arc.
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: node --check cloud/sim/index.js
      - name: Bring up the sim stack and read /api/stream
        run: bash cloud/sim/smoke.sh

  firmware:
    name: firmware build (${{ matrix.app }})
    runs-on: ubuntu-latest
    # A fresh-checkout `idf.py build` of each app: the Component Manager
    # fetches boat-mer at the pinned tag and the app must compile and link
    # against it. This is the proof the tag preflight below can only gesture
    # at. It is a compile check — nothing is flashed or run, so it says
    # nothing about behaviour on a board.
    container: espressif/idf:v5.5.4
    strategy:
      fail-fast: false
      matrix:
        app: [drone, ecandle]
    steps:
      - uses: actions/checkout@v4
      - name: Build apps/${{ matrix.app }}
        shell: bash
        working-directory: apps/${{ matrix.app }}
        run: |
          git config --global --add safe.directory '*'
          . "$IDF_PATH/export.sh"
          idf.py build
      - name: Report image size
        shell: bash
        working-directory: apps/${{ matrix.app }}
        run: ls -l build/*.bin

  boat-mer-tag-availability:
    name: boat-mer tag preflight
    runs-on: ubuntu-latest
    # boat-mer has been public since 2026-08-11, so this is now a hard gate:
    # the tag BOTH apps pin must exist publicly, or an external fresh-clone
    # build breaks. The tag is read from the manifests (never hardcoded here)
    # so this check cannot silently keep validating a tag we no longer pin.
    # curl-200 only proves the release page exists — the full proof remains a
    # fresh-clone `idf.py build` where the Component Manager fetches the tag.
    steps:
      - uses: actions/checkout@v4
      - name: Check the pinned boat-mer tag is publicly reachable
        run: |
          tags=$(grep -hA3 'TLAY-IO/boat-mer:' \
                   apps/drone/main/idf_component.yml \
                   apps/ecandle/main/idf_component.yml \
                 | grep -E '^\s*version:' | tr -d ' "' | cut -d: -f2 | sort -u)
          echo "pinned tag(s): $tags"
          if [ "$(echo "$tags" | wc -l)" -ne 1 ]; then
            echo "ERROR: apps/drone and apps/ecandle pin different boat-mer tags" && exit 1
          fi
          curl -fsS -o /dev/null -w "%{http_code}\n" \
            "https://github.com/TLAY-IO/boat-mer/releases/tag/${tags}" \
            || (echo "boat-mer ${tags} release not publicly reachable; external fresh-clone will fail" && exit 1)
