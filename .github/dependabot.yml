# Dependabot: weekly update PRs, grouped per directory so a routine week is a
# handful of PRs rather than one per package.
#
# Not covered: the firmware's boat-mer pin (apps/*/main/idf_component.yml) and
# the settle-worker's hashanchor pin are git tags, bumped by hand on purpose —
# both apps must move to the same boat-mer tag together.
#
# Ignored on purpose (take these by hand, as their own change):
#   - node image majors: only LTS lines are wanted as a base image, and
#     Dependabot proposes the newest major whether or not it is LTS.
#   - typescript / eslint / @types/node majors in cloud/web: they have to move
#     together with what eslint-config-next supports (TypeScript 7 broke lint).
version: 2
updates:
  - package-ecosystem: npm
    directory: /cloud/web
    schedule: { interval: weekly }
    groups:
      web: { patterns: ["*"] }
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /cloud/burn-intent-worker
    schedule: { interval: weekly }
    groups:
      burn-intent-worker: { patterns: ["*"] }
  - package-ecosystem: npm
    directory: /cloud/settle-worker
    schedule: { interval: weekly }
    groups:
      settle-worker: { patterns: ["*"] }
  - package-ecosystem: npm
    directory: /cloud/sim
    schedule: { interval: weekly }
    groups:
      sim: { patterns: ["*"] }
  - package-ecosystem: docker
    directories: ["/cloud/web", "/cloud/burn-intent-worker", "/cloud/settle-worker", "/cloud/sim"]
    schedule: { interval: weekly }
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
