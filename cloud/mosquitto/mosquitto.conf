## mosquitto.conf — demo MQTT broker (authentication required)
##
## Authentication is REQUIRED. The seller device blind-signs digests that
## arrive on its cmd/ topic, so an open broker is a signing oracle: anyone
## on the LAN could obtain signatures over attacker-chosen BurnIntents.
## The ACL below therefore restricts cmd/ publishing to the trusted worker.
##
## One-time setup (creates ./passwd next to this file):
##   ./gen-passwd.sh              # generates RANDOM passwords and prints them
##   ./gen-passwd.sh d w b        # or pass your own device/worker/web passwords
## Then put the matching URLs in ../.env (see .env.example).
## For internet-facing deployments additionally add TLS (cafile/certfile).

listener 1883 0.0.0.0
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

persistence true
persistence_location /mosquitto/data/

log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
