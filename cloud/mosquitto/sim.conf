# Broker config for docker-compose.sim.yml ONLY — the no-hardware stack.
#
# It allows anonymous clients, which mosquitto.conf deliberately does not.
# That is acceptable here for one reason: the sim stack publishes no broker
# port to the host, so the only clients that can reach it are the containers
# on its private compose network (web + sim), and none of them can sign or
# move anything.
#
# Never point a real device or the settle / burn-intent workers at a broker
# running this file. Real deployments use mosquitto.conf + acl + passwd.

listener 1883 0.0.0.0
allow_anonymous true
persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
